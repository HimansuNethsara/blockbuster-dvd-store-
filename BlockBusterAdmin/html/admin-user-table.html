<!DOCTYPE html>
<html>
  <head> 
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>BlockBuster | Admin - User Table </title>
    <meta name="description" content="">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="all,follow">
    <!-- Bootstrap CSS-->
    <link rel="stylesheet" href="../css/vendor/bootstrap.min.css">
    <!-- Font Awesome CSS-->
    <link rel="stylesheet" href="../fonts/font-awesome/css/font-awesome.min.css">
    <!-- Custom Font Icons CSS-->
    <link rel="stylesheet" href="../css/admin/font.css">
    <!-- Google fonts - Muli-->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Muli:300,400,700">
    <!-- theme stylesheet-->
    <link rel="stylesheet" href="../css/admin/style.default.css" id="theme-stylesheet">
    <!-- Custom stylesheet - for your changes-->
    <link rel="stylesheet" href="../css/notification.css"/>
    <!-- Favicon-->
    <link rel="icon" type="image/x-icon" href="../images/B.png">
  </head>
  <body>
    <header class="header" id="page-header"></header>
    <div class="d-flex align-items-stretch">
      <!-- Sidebar Navigation-->
      <nav id="sidebar"></nav>
      <!-- Sidebar Navigation end-->
      <div class="page-content">
        <!-- Page Header-->
        <div class="page-header no-margin-bottom">
          <div class="container-fluid">
            <h2 class="h5 no-margin-bottom">User Table</h2>
          </div>
        </div>
        <!-- Breadcrumb-->
        <div class="container-fluid">
          <ul class="breadcrumb">
            <li class="breadcrumb-item"><a href="admin-dashboard.html">Home</a></li>
            <li class="breadcrumb-item active">User Table            </li>
          </ul>
        </div>
        <section class="no-padding-top">
          <div class="container-fluid">
            <div class="row">
              <div class="col-lg-12">
                <div class="block">
                    <div class="table-responsive"> 
                        <table class="table table-striped table-hover">
                          <thead>
                            <tr>
                              <th>ID</th>
                              <th>First Name</th>
                              <th>Last Name</th>
                              <th>Email</th>
                              <th>Status</th>
                              <th>Joined</th>
                              <th>Actions</th>
                            </tr>
                          </thead>
                          <tbody>
                            <tr>
                              <th scope="row"></th>
                              <td></td>
                              <td></td>
                              <td></td>
                              <td></td>
                              <td></td>
                            </tr>
                          </tbody>
                        </table>
                    </div>
                    </div>
                    <div class="block">
                        <div class="block-body">
                            <form>
                              <div class="line"></div>
                              <div class="form-group row">
                                <div class="col-sm-9">
                                  <button type="button" class="btn btn-primary" onclick="printUserList();">Print User List</button>
                                </div>
                              </div>
                            </form>
                        </div>
                    </div>
              </div>
            </div>
          </div>
        </section>
        <footer class="footer"></footer>
      </div>
    </div>

    <!-- Edit User Modal -->
    <div class="modal fade" id="editUserModal" tabindex="-1" role="dialog" aria-labelledby="editUserModalLabel" aria-hidden="true">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="editUserModalLabel">
                        <i class="fa fa-user-edit"></i> Edit User Details
                    </h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <form id="editUserForm">
                        <div class="form-group">
                            <label for="editFirstName"><i class="fa fa-user"></i> First Name</label>
                            <input type="text" class="form-control" id="editFirstName" placeholder="Enter first name">
                        </div>
                        <div class="form-group">
                            <label for="editLastName"><i class="fa fa-user"></i> Last Name</label>
                            <input type="text" class="form-control" id="editLastName" placeholder="Enter last name">
                        </div>
                        <input type="hidden" id="editUserId">
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">
                        <i class="fa fa-times"></i> Cancel
                    </button>
                    <button type="button" class="btn btn-primary" onclick="saveUserChanges()">
                        <i class="fa fa-save"></i> Save Changes
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Delete User Confirmation Modal -->
    <div class="modal fade" id="deleteUserModal" tabindex="-1" role="dialog" aria-labelledby="deleteUserModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-sm" role="document">
            <div class="modal-content">
                <div class="modal-header bg-danger text-white">
                    <h5 class="modal-title" id="deleteUserModalLabel">
                        <i class="fa fa-exclamation-triangle"></i> Confirm Deletion
                    </h5>
                    <button type="button" class="close text-white" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body text-center">
                    <i class="fa fa-user-times" style="font-size: 48px; color: #dc3545; margin-bottom: 15px;"></i>
                    <p class="mb-2">Are you sure you want to delete this user?</p>
                    <p class="mb-0" id="deleteUserEmail" style="font-weight: bold; color: #dc3545;"></p>
                    <p class="text-muted small mt-2">This action cannot be undone!</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">
                        <i class="fa fa-times"></i> Cancel
                    </button>
                    <button type="button" class="btn btn-danger" onclick="confirmDeleteUser()">
                        <i class="fa fa-trash"></i> Delete User
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript files-->
    <script src="../js/vendor/jquery.min.js"></script>
    <script src="../js/vendor/bootstrap.min.js"></script>
    <script src="../js/vendor/jquery.cookie.js"></script>
    <script src="../js/admin/front.js"></script>     
    <script src="../js/admin/admin-content-loader.js"></script>
    <script src="../js/notification.js"></script>
    <script src="../js/admin/admin-sign-out.js"></script>

    <script src="../js/globals.js"></script>
    
    <!-- Module initialization must load FIRST -->
    <script src="../js/module-init.js"></script>
    
    <!-- Firebase Configuration and Modules -->
    <script type="module" src="../firebaseConfig.js"></script>
    <script type="module" src="../js/admin/admin-user-table.js"></script>
    <script type="module" src="../js/admin/admin-sign-in.js"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/2.11.8/umd/popper.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-validate/1.19.5/jquery.validate.min.js"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/2.11.8/umd/popper.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-validate/1.19.5/jquery.validate.min.js"></script>
  </body>
</html>
